<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0E0F13" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Forja" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <title>Forja</title>
    <style>
      html, body { height: 100%; margin: 0; background: #0E0F13; }
      body { overflow: hidden; }
      #root { display: flex; height: 100%; flex: 1; }
    </style>
    <meta name="description" content="Rutinas de gym a tu medida, despensa con escáner de tickets, recetas con lo que tienes y retos con amigos." />
    <script>
      // Chrome avisa una sola vez de que la app se puede instalar: se guarda para el botón "Instalar".
      window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__instalar = e; window.dispatchEvent(new Event('forja-instalable')); });
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
