name: Publicar en GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web
        env:
          # Valores PÚBLICOS (van dentro de la web): proyecto forja-prod y su clave publicable. Nunca poner aquí claves secretas.
          EXPO_PUBLIC_SUPABASE_URL: https://pgqqghsxjsgeuhvcutlm.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_QESduzAig2zwgNLUU68p6g_XrcOdmoR
          # Titular y contacto de los textos legales: se leen de las variables del repositorio (no se escriben aquí).
          EXPO_PUBLIC_TITULAR: ${{ vars.EXPO_PUBLIC_TITULAR }}
          EXPO_PUBLIC_CORREO_CONTACTO: ${{ vars.EXPO_PUBLIC_CORREO_CONTACTO }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
